<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Systemic Risk Dashboard</title>

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }

        h2 {
            margin: 6px 0 8px 0;
            font-size: 18px;
        }

        /* ---------- GRID LAYOUT ---------- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 14px;
            padding: 12px;
        }

        .panel {
            border: 1px solid #ddd;
            padding: 8px;
            background: #fff;
        }

        /* ---------- TABLE TIGHTENING ---------- */
        .topic-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .topic-table th,
        .topic-table td {
            border: 1px solid #ddd;
            padding: 6px 8px;
            vertical-align: top;
        }

        .topic-table th {
            background: #f5f5f5;
            text-align: left;
        }

        .summary-cell {
            line-height: 1.25;
            max-width: 520px;
        }

        /* ---------- SCROLL CONTROL ---------- */
        .scroll {
            max-height: 620px;
            overflow-y: auto;
        }

        /* ---------- REFRESH BUTTON ---------- */
        .refresh-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: #f9f9f9;
            border-bottom: 1px solid #ddd;
        }

        #refresh-btn {
            padding: 7px 18px;
            font-size: 14px;
            font-weight: bold;
            background: #2a6ebb;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #refresh-btn:disabled {
            background: #888;
            cursor: not-allowed;
        }

        #refresh-status {
            font-size: 13px;
            color: #444;
        }
    </style>
</head>

<body>

<div class="refresh-bar">
    <button id="refresh-btn" onclick="triggerRefresh()">&#x27F3; Refresh Dashboard</button>
    <span id="refresh-status"></span>
</div>

<script>
    const OWNER = "Shoanjoshi";
    const REPO  = "news-dashboard-v2";
    const WORKFLOW = "schedule.yml";

    function getToken() {
        let token = localStorage.getItem("gh_dispatch_token");
        if (!token) {
            token = prompt("Enter a GitHub Personal Access Token with 'actions: write' permission:");
            if (token) localStorage.setItem("gh_dispatch_token", token.trim());
        }
        return token ? token.trim() : null;
    }

    async function triggerRefresh() {
        const btn = document.getElementById("refresh-btn");
        const status = document.getElementById("refresh-status");
        const token = getToken();
        if (!token) { status.textContent = "No token provided."; return; }

        btn.disabled = true;
        status.textContent = "Triggering refresh...";

        try {
            const res = await fetch(
                `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
                {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Accept": "application/vnd.github+json",
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ ref: "main" }),
                }
            );

            if (res.status === 204) {
                status.textContent = "✅ Refresh triggered — dashboard will update in ~5 minutes.";
            } else if (res.status === 401) {
                localStorage.removeItem("gh_dispatch_token");
                status.textContent = "❌ Invalid token — please try again.";
            } else {
                const body = await res.json().catch(() => ({}));
                status.textContent = `❌ Error ${res.status}: ${body.message || "unknown error"}`;
            }
        } catch (e) {
            status.textContent = `❌ Request failed: ${e.message}`;
        } finally {
            btn.disabled = false;
        }
    }
</script>

<div class="dashboard-grid">

    <!-- TOP LEFT: Topic Map -->
    <div class="panel">
        <h2>Intertopic Distance Map</h2>
        {{ topic_map_html | safe }}
    </div>

    <!-- TOP RIGHT: Theme Scatter -->
    <div class="panel">
        <h2>Theme Signals</h2>
        {{ theme_scatter_html | safe }}
    </div>

    <!-- BOTTOM LEFT: Topic Summary Table -->
    <div class="panel scroll">
        <h2>Topic Summaries</h2>
        {{ topic_table_html | safe }}
    </div>

    <!-- BOTTOM RIGHT: Heatmap -->
    <div class="panel">
        <h2>Theme × Topic Affinity</h2>
        {{ heatmap_html | safe }}
    </div>

</div>

</body>
</html>
